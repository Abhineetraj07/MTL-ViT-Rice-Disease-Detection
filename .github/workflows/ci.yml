name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install CI tools only
        # Skip torch/timm/gradio — too heavy for CI and needs GPU
        # Only install lightweight linting + test tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest numpy pillow scikit-learn

      - name: Lint — syntax errors and undefined names
        run: |
          flake8 src/ app.py --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint — style warnings (non-blocking)
        run: |
          flake8 src/ app.py --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

      - name: Format check (non-blocking)
        run: |
          black --check --diff src/ app.py || echo "ℹ️  Run 'black src/ app.py' to fix formatting"

      - name: Validate src package structure
        # Checks that src/__init__.py exists and is importable without torch
        run: |
          test -f src/__init__.py && echo "✅ src/__init__.py exists" || echo "❌ src/__init__.py missing"
          python -c "import ast, os
          for root, _, files in os.walk('src'):
              for f in files:
                  if f.endswith('.py'):
                      path = os.path.join(root, f)
                      with open(path) as fp:
                          try:
                              ast.parse(fp.read())
                              print(f'✅ {path} — valid syntax')
                          except SyntaxError as e:
                              print(f'❌ {path} — {e}')
                              exit(1)
          "

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "ℹ️  No tests yet — add tests in /tests folder"

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run pip-audit security check (non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || echo "ℹ️  Vulnerability warnings found — review above"

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files and folders
        run: |
          echo "Checking project structure..."
          test -f requirements.txt  && echo "✅ requirements.txt"  || echo "❌ requirements.txt missing"
          test -f README.md         && echo "✅ README.md"          || echo "❌ README.md missing"
          test -f app.py            && echo "✅ app.py"             || echo "❌ app.py missing"
          test -d src               && echo "✅ src/ directory"     || echo "❌ src/ directory missing"
          test -d outputs           && echo "✅ outputs/ directory" || echo "ℹ️  outputs/ not yet present"
          echo "Structure check complete."
